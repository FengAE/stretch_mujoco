[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strech-codex"
version = "0.1.0"
description = "Robot Codex agent — MCP-based orchestration for MuJoCo robots"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Claude"}]
dependencies = [
    "click>=8.1.8",
    "hello-robot-stretch-mujoco>=0.5.0",
    "numpy",
    "mujoco==3.2.6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
codex = ["openai-codex", "mcp>=1.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
vlfm = [
    "openai>=1.0",
    "pillow>=10.0",
    "torch>=2.2",
    "transformers>=4.40",
]

[project.scripts]
strech-codex = "strech_codex.cli:main"
strech-codex-mcp = "strech_codex.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: simulator integration tests"]
